[pytest]
# [v1.7 P2-1] pytest 配置
# 用法：
#   cd app
#   ../python/python.exe -m pytest                 # 跑全部
#   ../python/python.exe -m pytest tests/ -v        # 详细模式
#   ../python/python.exe -m pytest -m "not slow"    # 跳过慢测试
#   ../python/python.exe -m pytest --cov=modules   # 含覆盖率

# 测试目录
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 搜索路径：让 tests 能 import modules.*
pythonpath = .

# 默认选项：显示短回溯 + 颜色 + 严格标记
addopts =
    -ra
    --color=yes
    --strict-markers
    --tb=short
    --durations=10

# 自定义标记
markers =
    unit: 单元测试，纯 Python 逻辑，无外部依赖
    integration: 集成测试，涉及多模块协作
    api: API 契约测试，使用 FastAPI TestClient
    slow: 慢测试（长跑、压测、真实 LLM 调用），默认不在 CI 跑
    requires_llm: 需要真实 LLM 后端的测试
    asyncio: pytest-asyncio 异步测试标记

# 异步支持
asyncio_mode = auto

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning:chromadb.*
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning
